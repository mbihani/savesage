command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_HOST
    value: "https://fevm-stable-classic-7ppxjq.cloud.databricks.com"
  - name: EXTRACTION_ENDPOINT
    value: databricks-gpt-5-6-luna
  - name: JUDGE_ENDPOINT
    value: databricks-claude-opus-5
  # --- Workstream 3: Lakebase connection ---
  # The database resource binding injects PGHOST/PGUSER/PGPORT/PGDATABASE
  # automatically; ENDPOINT_NAME is consumed by the OAuthConnectionFactory
  # to request a fresh per-connection credential token.
  - name: ENDPOINT_NAME
    value: projects/savesage-statement-agent/branches/production/endpoints/primary
  - name: PGSSLMODE
    value: require
  # --- Workstream 4: MLflow tracing ---
  - name: WS4_TRACING_ENABLED
    value: "true"
  - name: WS4_TRACKING_URI
    value: databricks
  # The numeric MLflow experiment ID. configure_tracing prefers this env var
  # (injected by the bound experiment resource) over the experiment PATH -- the
  # ID survives experiment recreation and cross-workspace deploys. Set here
  # explicitly as a belt-and-suspenders fallback if the resource binding ever
  # stops injecting it. Replace if deploying to a different workspace.
  - name: MLFLOW_EXPERIMENT_ID
    value: "967014443183055"
# --- Bound resources ---
# WS3: Lakebase Postgres (permission CAN_CONNECT_AND_CREATE so the app SP
# can both connect and create the source tables on first boot).
# WS4: MLflow experiment (CAN_EDIT so the agent can write traces and log
# feedback assessments).  The experiment_id is the numeric ID from
# `databricks experiments list`; replace it if deploying to a different
# workspace.
resources:
  - name: savesage-statement-agent-mlflow
    description: "MLflow experiment for statement-agent tracing + field feedback"
    experiment:
      experiment_id: "967014443183055"
      permission: CAN_EDIT
  - name: savesage-lakebase
    description: "Lakebase Postgres for statement results + field feedback"
    database:
      instance_name: "savesage-statement-agent"
      database_name: "databricks_postgres"
      permission: CAN_CONNECT_AND_CREATE
