command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_HOST
    value: "https://fevm-stable-classic-7ppxjq.cloud.databricks.com"
  - name: EXTRACTION_ENDPOINT
    value: databricks-gpt-5-6-luna
  - name: JUDGE_ENDPOINT
    value: databricks-claude-opus-5
  # --- RDS Postgres connection (replaces Lakebase) ---
  # Direct connection to an AWS RDS Postgres instance using username/password
  # credentials — no WorkspaceClient, no endpoint API, no per-connection
  # token. See ``_build_rds_stores`` in app/main.py.
  - name: RDS_HOST
    value: your-rds-instance.xxxxxx.us-east-1.rds.amazonaws.com
  - name: RDS_PORT
    value: '5432'
  - name: RDS_DATABASE
    value: postgres
  - name: RDS_USER
    value: postgres
  - name: RDS_PASSWORD
    value: CHANGE_ME
  - name: RDS_SSLMODE
    value: require
  # --- Workstream 4: MLflow tracing ---
  - name: WS4_TRACING_ENABLED
    value: "true"
  - name: WS4_TRACKING_URI
    value: databricks
  # The MLflow experiment NAME (path). On a fresh customer workspace no
  # experiment exists yet — mlflow.set_experiment() (called by the tracing
  # layer on the first parse) auto-creates it at this path, so no bound
  # experiment resource or hardcoded numeric ID is needed. Override to a
  # different workspace-relative path (e.g. /Users/<user>/savesage/statement-agent)
  # to isolate traces per workspace. For backward compat, a deployment may
  # still set MLFLOW_EXPERIMENT_ID (the numeric ID), which takes precedence.
  - name: MLFLOW_EXPERIMENT_NAME
    value: "/Shared/savesage/statement-agent"
  # --- Background judge scheduler ---
  # Run the post-hoc judge every N hours (default 6). Set to 0 to disable the
  # scheduler entirely (the /api/run-judge + on-demand endpoints still work).
  - name: JUDGE_INTERVAL_HOURS
    value: "6"
  # Number of recent parses the scheduled judge samples per run (default 10).
  - name: JUDGE_SAMPLE_SIZE
    value: "10"
# Note: no Databricks ``database`` or ``experiment`` resource binding is
# needed — the app connects to RDS Postgres directly via ``RDS_*`` env vars
# (see ``_build_rds_stores`` in app/main.py) and resolves the MLflow
# experiment by NAME (auto-created on first parse), not by a bound ID.
