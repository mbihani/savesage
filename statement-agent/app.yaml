command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DATABRICKS_HOST
    value: "https://fevm-stable-classic-7ppxjq.cloud.databricks.com"
  - name: EXTRACTION_ENDPOINT
    value: databricks-gpt-5-6-luna
  - name: JUDGE_ENDPOINT
    value: databricks-claude-opus-5
  # --- Workstream 3: Lakebase connection ---
  # pg_version=17 Lakebase projects are NOT registered in the Databricks
  # Database Instances API, so the app ``database`` resource binding cannot
  # inject PGHOST/PGUSER/PGPORT/PGDATABASE.  The app instead derives the host
  # from the Lakebase endpoint status API (w.postgres.get_endpoint) and the
  # user from the WorkspaceClient identity; see ``_build_lakebase_stores`` in
  # app/main.py.  PGHOST/PGDATABASE/PGPORT are set here as explicit fallback
  # values (PGHOST is informational — the API-derived host takes precedence
  # at connect time; PGDATABASE/PGPORT are the real fallbacks).  ENDPOINT_NAME
  # is consumed by the OAuthConnectionFactory to request a fresh
  # per-connection credential token.
  - name: ENDPOINT_NAME
    value: projects/savesage-statement-agent/branches/production/endpoints/primary
  - name: PGHOST
    value: ep-long-mountain-d25gb0m7.database.us-east-1.cloud.databricks.com
  - name: PGDATABASE
    value: databricks_postgres
  - name: PGPORT
    value: '5432'
  - name: PGSSLMODE
    value: require
  # --- Workstream 4: MLflow tracing ---
  - name: WS4_TRACING_ENABLED
    value: "true"
  - name: WS4_TRACKING_URI
    value: databricks
  # The numeric MLflow experiment ID. configure_tracing prefers this env var
  # (injected by the bound experiment resource) over the experiment PATH -- the
  # ID survives experiment recreation and cross-workspace deploys. Set here
  # explicitly as a belt-and-suspenders fallback if the resource binding ever
  # stops injecting it. Replace if deploying to a different workspace.
  - name: MLFLOW_EXPERIMENT_ID
    value: "967014443183055"
# --- Bound resources ---
# WS4: MLflow experiment (CAN_EDIT so the agent can write traces and log
# feedback assessments).  The experiment_id is the numeric ID from
# `databricks experiments list`; replace it if deploying to a different
# workspace.
#
# Note: the Lakebase Postgres ``database`` resource binding is intentionally
# omitted — it does not work for pg_version=17 Lakebase projects (the project
# is not registered in the Database Instances API, so the binding cannot
# inject connection env vars).  Connection parameters are derived at runtime
# instead; see ``_build_lakebase_stores`` in app/main.py.
resources:
  - name: savesage-mlflow
    description: "MLflow experiment for statement-agent tracing + field feedback"
    experiment:
      experiment_id: "967014443183055"
      permission: CAN_EDIT
